name: Build containers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: SDK to build (select a release tag to publish)
        type: choice
        options: [all, qt5, qt6, android]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select changed SDK recipes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.target }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ "$REQUESTED" == all ]]; then
              targets='["qt5","qt6","android"]'
            else
              targets=$(jq -cn --arg target "$REQUESTED" '[$target]')
            fi
          else
            if [[ "$EVENT" == pull_request ]]; then
              base=$PR_BASE
            elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              # A cancelled or failed tag did not finish publishing its SDKs.
              releases=$(gh api --paginate --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?status=success&event=push&per_page=100" \
                --jq '.workflow_runs[] | select(.head_branch | test("^v[0-9]")) | .head_sha')
              base=${releases%%$'\n'*}
            else
              base=$PUSH_BASE
            fi
            targets='[]'
            for target in qt5 qt6 android; do
              if [[ -z "$base" || "$base" =~ ^0+$ ]] || \
                  ! git diff --quiet "$base" HEAD -- "$target/"; then
                targets=$(jq -c --arg target "$target" '. + [$target]' <<< "$targets")
              fi
            done
          fi
          echo "Selected SDKs: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  sdk:
    needs: select
    if: needs.select.outputs.targets != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/build-sdk.yml
    with:
      target: ${{ matrix.target }}
